<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cargando... | GC</title>
  <style>
    /* -------------------------------------------------- */
    /* CONFIGURACIÓN GENERAL Y FUENTES                    */
    /* -------------------------------------------------- */
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

    :root {
      --bg-color: #000000;
      --gold-main: #d4af37;
      --gold-light: #f3e5ab;
      --cyan-neon: #00f3ff;
      --cyan-soft: #5ce1e6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
    }

    /* CONTENEDOR PRINCIPAL ORDENADO A LO LARGO */
    .intro-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 800px;
      padding: 20px;
      text-align: center;
    }

    /* -------------------------------------------------- */
    /* LOGO Y ANILLOS TECNOLÓGICOS (ESTILO MATRIX)        */
    /* -------------------------------------------------- */
    .logo-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 50px; /* Espacio amplio para evitar solapamientos */
    }

    /* Texto GC en dorado metálico */
    .logo-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-main) 50%, #aa7c11 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 4px;
      z-index: 5;
      filter: drop-shadow(0px 0px 10px rgba(212, 175, 55, 0.5));
    }

    /* Anillo exterior - Giro horario en dorado */
    .ring-outer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--gold-main);
      border-bottom-color: var(--gold-main);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      animation: spinClockwise 3s linear infinite;
    }

    /* Anillo intermedio - Giro antihorario en celeste Matrix */
    .ring-middle {
      position: absolute;
      top: -12px;
      left: -12px;
      width: calc(100% + 24px);
      height: calc(100% + 24px);
      border-radius: 50%;
      border: 2px dashed var(--cyan-neon);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.25);
      animation: spinCounterClockwise 5s linear infinite;
      opacity: 0.7;
    }

    /* Anillo interior - Puntos HUD */
    .ring-inner {
      position: absolute;
      top: 12px;
      left: 12px;
      width: calc(100% - 24px);
      height: calc(100% - 24px);
      border-radius: 50%;
      border: 2px dotted var(--gold-light);
      animation: spinClockwise 8s linear infinite;
      opacity: 0.5;
    }

    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinCounterClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    /* -------------------------------------------------- */
    /* CAJA DE TEXTO INFERIOR (SIN TAPAR EL LOGO)         */
    /* -------------------------------------------------- */
    .text-container {
      position: relative;
      width: 100%;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .msg {
      position: absolute;
      width: 100%;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--cyan-soft);
      text-shadow: 0 0 10px rgba(92, 225, 230, 0.4);
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #welcomeMsg {
      opacity: 1;
      transform: translateY(0);
    }

    #servicesMsg {
      opacity: 0;
      transform: translateY(20px);
    }

    .fade-out {
      opacity: 0 !important;
      transform: translateY(-20px) !important;
    }

    .fade-in {
      opacity: 1 !important;
      transform: translateY(0) !important;
    }

    @media (max-width: 600px) {
      .logo-wrapper { width: 140px; height: 140px; margin-bottom: 40px; }
      .logo-text { font-size: 2.7rem; }
      .msg { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <div class="intro-container">
    <!-- LOGO GC CON ANILLOS TECNOLÓGICOS TIPO MATRIX -->
    <div class="logo-wrapper">
      <div class="ring-outer"></div>
      <div class="ring-middle"></div>
      <div class="ring-inner"></div>
      <div class="logo-text">GC</div>
    </div>

    <!-- TEXTOS ANIMADOS CON ESPACIO PROPIO -->
    <div class="text-container">
      <div class="msg" id="welcomeMsg">Bienvenid@</div>
      <div class="msg" id="servicesMsg">Estos son mis servicios y experiencias</div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // CONFIGURACIÓN DE TU PÁGINA SIGUIENTE
      const NEXT_PAGE_URL = 'mio.html'; // Cambiá este nombre por el de tu archivo objetivo

      const welcomeMsg = document.getElementById('welcomeMsg');
      const servicesMsg = document.getElementById('servicesMsg');

      // Paso 1: Transición de texto a los 3.5 segundos
      setTimeout(() => {
        welcomeMsg.classList.add('fade-out');
        setTimeout(() => {
          servicesMsg.classList.add('fade-in');
        }, 400);
      }, 3500);

      // Paso 2: Redirección automática a los 8 segundos hacia tu otra página
      setTimeout(() => {
        window.location.href = NEXT_PAGE_URL;
      }, 8000);
    });
  </script>

</body>
</html>
